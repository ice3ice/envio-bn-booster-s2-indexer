type UserHistory {
  id: ID!
  user: String! # (address)
  operation: String! # Delegated, DelegateAmountIncreased, DelegateUnstakingInitiated, DelegateUnstaked, RewardsClaimed
  amount: BigInt!
  blockTimestamp: Int!
  transactionHash: String!
}

type UserLevel {
  id: String! # address
  level: Int! # 1, 2
  blockTimestamp: Int!
  transactionHash: String!
}
