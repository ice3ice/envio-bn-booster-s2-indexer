type UserHistory {
  id: ID!
  user: String! # (address)
  operation: String! # Delegated, DelegateAmountIncreased, DelegateUnstakingInitiated, DelegateUnstaked, DelegateLockupIncreased
  amount: BigInt!
  period: BigInt!
  blockTimestamp: Int!
  transactionHash: String!
}

type UserTaskCompleted {
  id: String!
  task1Completed: Boolean!
  task2Completed: Boolean!
  task3Completed: Boolean!
  task4Completed: Boolean!
  task5Completed: Boolean!
}
