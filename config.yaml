name: envio-bn-booster-s2-indexer
description: Envio Binance Booster S2 indexer
#Global contract definitions that must contain all definitions except
#addresses. Now you can share a single handler/abi/event definitions
#for contracts across multiple chains
contracts:
  - name: StakingRewards
    abi_file_path: ./abis/staking-rewards-abi.json
    handler: ./src/StakingRewardsEventHandlers.js
    events:
      - event: RewardsClaimed(address indexed user, uint256 amount)
  - name: NodeStakingVault
    abi_file_path: ./abis/node-staking-vault-abi.json
    handler: ./src/NodeStakingVaultEventHandlers.js
    events:
      - event: DelegateAmountIncreased(address indexed user, address indexed node, uint256 amount, uint256 newTotalAmount, uint256 effectiveMultiplier)
      - event: DelegateUnstaked(address indexed user, uint256 amount)
      - event: DelegateUnstakingInitiated(address indexed user, address indexed node, uint256 amount, uint256 cooldownAmount)
      - event: Delegated(address indexed user, address indexed node, uint256 amount, uint256 effectiveMultiplier, uint256 effectiveLockUpPeriod)
rollback_on_reorg: false
networks:
  - id: 97 # BSC
    start_block: 75162899
    contracts:
      - name: StakingRewards
        address: "0xca9c37E0362Fb76a0f349f67D1F0A69F3E0873E7"
      - name: NodeStakingVault
        address: "0x2b166C53eDCB251E8D5763b381dD8d184368257D"
field_selection:
  transaction_fields:
    - "hash"
    - "transactionIndex"
